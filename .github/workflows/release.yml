name: Release

# Builds, signs and notarises the desktop app, then attaches it to a GitHub
# Release. Triggered by a version tag, or manually.
#
# Required secrets for a *signed* build (see docs/RELEASING.md):
#   APPLE_CERTIFICATE            base64 of the Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD   its password
#   KEYCHAIN_PASSWORD            any password for the temporary CI keychain
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   for notarisation
#
# Without APPLE_CERTIFICATE the workflow still runs and produces an UNSIGNED
# build, with a warning — so a fork or a pre-certificate run is not blocked, but
# nobody mistakes the artifact for distributable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Tauri's beforeBuildCommand runs `npm run build`; without this the frontend
      # build can exceed the runner's default Node heap. See ci.yml.
      NODE_OPTIONS: --max-old-space-size=4096
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are deliberately NOT set here.
      # Tauri notarises automatically whenever it sees all three, and that path
      # blocked for 30+ minutes with no output (see "Notarise and staple").
      # They are scoped to the steps that actually need them.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .tauri

      - run: npm ci

      - name: Verify before shipping
        run: npm run verify

      - name: Build the engine sidecar
        run: scripts/build_engine_sidecar.sh

      - name: Fetch the Codex agent runtime
        run: scripts/fetch_codex_sidecar.sh

      - name: Warn when signing is not configured
        if: env.APPLE_CERTIFICATE == ''
        run: |
          echo "::warning::APPLE_CERTIFICATE is not set — building UNSIGNED. \
          Gatekeeper will quarantine this on other machines; see docs/RELEASING.md."

      - name: Import the signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # `notarytool` reads the password from stdin when the one it was given is
      # empty, so a blank APPLE_PASSWORD shows up as a silent hang inside the
      # bundle step — 35 minutes, zero output, no error. Verify the credentials
      # with an authenticated round-trip first: it fails in seconds and names the
      # variable instead of looking like a slow notarisation.
      - name: Preflight the notarisation credentials
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$v" || true)" ]; then
              echo "::error::$v is empty or unset — notarytool would block waiting for input."
              exit 1
            fi
          done
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > /dev/null
          echo "Notarisation credentials accepted."

      # Tauri signs from APPLE_SIGNING_IDENTITY and notarises automatically when
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are present.
      - name: Bundle
        working-directory: .tauri
        # The app alone. `--bundles app,dmg` looks tidier and is wrong: the DMG
        # bundler rebuilds the app and then consumes it, so the nested signing
        # below is thrown away and the disk image ships an app Apple will reject.
        # Verified locally — after a `--bundles dmg` run the loose `.app` is gone.
        timeout-minutes: 20
        run: ../node_modules/.bin/tauri build --bundles app

      # Tauri signs the app and the `externalBin` sidecars, but a resource
      # *directory* is copied verbatim — so the frozen engine and its libpython
      # stay ad-hoc signed while everything around them gets a Developer ID.
      # Notarisation rejects that. Nested code first, then the bundle is re-sealed.
      - name: Sign the bundled resources
        if: env.APPLE_CERTIFICATE != ''
        run: scripts/sign_bundle.sh

      # Tauri runs `notarytool submit --wait` internally and discards its output,
      # so a submission that never finishes looks like a silent hang. Drive the
      # notary service here instead: `--wait` prints the submission id and polls
      # the status, and stapler attaches the ticket so the app validates offline.
      - name: Notarise and staple
        if: env.APPLE_CERTIFICATE != ''
        timeout-minutes: 25
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP=".tauri/target/release/bundle/macos/ACSA Code.app"
          # Submitted from a temp copy; the artefact that ships is zipped *after*
          # stapling. Zipping first was a real defect: the ticket is attached to
          # the app by `stapler`, so a zip made before that carries no ticket and
          # only validates with a network round-trip.
          SUBMIT_ZIP="$RUNNER_TEMP/ACSA-Code.app.zip"
          SHIP_ZIP=".tauri/target/release/bundle/macos/ACSA-Code.app.zip"
          rm -f "$SUBMIT_ZIP" "$SHIP_ZIP"
          ditto -c -k --keepParent "$APP" "$SUBMIT_ZIP"
          xcrun notarytool submit "$SUBMIT_ZIP" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          ditto -c -k --keepParent "$APP" "$SHIP_ZIP"

      - name: Confirm the bundle resolves its engine
        run: |
          set -euo pipefail
          APP=".tauri/target/release/bundle/macos/ACSA Code.app"
          test -x "$APP/Contents/Resources/engine/acsa-engine/acsa-engine"
          # The agent runtime, for the same reason: it is fetched at build time and
          # shipped, so a user needs no Codex install of their own. A build that lost
          # this step starts, opens a chat, and cannot run an agent.
          test -x "$APP/Contents/Resources/engine-codex/codex"
          # `acsa_engine.py` is the entry point; `manager.py` was deleted with
          # the deterministic harness and this checked for it anyway.
          test -f "$APP/Contents/Resources/core-engine/acsa_engine.py"
          "$APP/Contents/MacOS/acsa-code" > /tmp/launch.log 2>&1 &
          PID=$!
          sleep 12
          kill "$PID" 2>/dev/null || true
          grep -q "Engine dir" /tmp/launch.log || (cat /tmp/launch.log; exit 1)

      - name: Verify the signature and notarisation ticket
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          APP=".tauri/target/release/bundle/macos/ACSA Code.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      # A tag push publishes; a manual run has to leave something behind, or the
      # only proof it worked is a green tick and the notarised build dies with the
      # runner. `if-no-files-found: warn` keeps an unsigned dry run from failing.
      - name: Upload the notarised build
        uses: actions/upload-artifact@v4
        with:
          name: ACSA-Code-macos-notarised
          path: .tauri/target/release/bundle/macos/ACSA-Code.app.zip
          if-no-files-found: warn
          retention-days: 14

      # The updater artifact has to be built from the *stapled* app, not from the
      # build output: a tarball made earlier carries no notarisation ticket, so
      # every update would re-introduce the Gatekeeper prompt we just removed.
      # It is signed with the minisign key, which is separate from the Apple
      # certificate — the app verifies it against `plugins.updater.pubkey`.
      - name: Build and sign the updater artifact
        if: env.APPLE_CERTIFICATE != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE=".tauri/target/release/bundle/macos"
          # Hyphenated on purpose. The app bundle is `ACSA Code.app`, but an
          # *asset* name with a space is rewritten by GitHub when it is uploaded
          # — `ACSA Code.app.tar.gz` arrived as `ACSA.Code.app.tar.gz` — so the
          # manifest URL resolved to nothing and every update 404'd. The tarball
          # stores the bundle under its real name; only the file we upload is
          # renamed, and nothing has to be escaped or guessed.
          rm -f "$BUNDLE/ACSA-Code.app.tar.gz" "$BUNDLE/ACSA-Code.app.tar.gz.sig"
          tar -czf "$BUNDLE/ACSA-Code.app.tar.gz" -C "$BUNDLE" "ACSA Code.app"
          npx tauri signer sign "$BUNDLE/ACSA-Code.app.tar.gz"
          test -f "$BUNDLE/ACSA-Code.app.tar.gz.sig" \
            || { echo "::error::no signature was produced — TAURI_SIGNING_PRIVATE_KEY is probably unset"; exit 1; }

      # What the app fetches on launch. Written only for a tag, because the URL
      # has to point at a release that exists.
      - name: Write the update manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          version = json.load(open(".tauri/tauri.conf.json"))["version"]
          bundle = pathlib.Path(".tauri/target/release/bundle/macos")
          signature = (bundle / "ACSA-Code.app.tar.gz.sig").read_text().strip()
          manifest = {
              "version": version,
              "notes": f"Built from {os.environ.get('GITHUB_SHA', '')[:8]}.",
              "pub_date": __import__("datetime").datetime.now(__import__("datetime").timezone.utc)
                            .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": signature,
                      "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                             f"/releases/download/{tag}/ACSA-Code.app.tar.gz",
                  }
              },
          }
          (bundle / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          # The signed, notarised, stapled app. The disk image is deliberately
          # not built here: it has to be made *from* the stapled app, and Tauri's
          # bundler cannot do that (see the Bundle step).
          files: |
            .tauri/target/release/bundle/macos/ACSA-Code.app.zip
            .tauri/target/release/bundle/macos/ACSA-Code.app.tar.gz
            .tauri/target/release/bundle/macos/ACSA-Code.app.tar.gz.sig
            .tauri/target/release/bundle/macos/latest.json
          body: |
            Built from ${{ github.sha }}.

            **Download:** `ACSA-Code.app.zip` — signed with a Developer ID,
            notarised and stapled, so it opens without the Gatekeeper prompt.
            Unzip and drag `ACSA Code.app` to Applications.

            **Already installed?** The app checks `latest.json` on launch and
            offers an update in the title bar, and the zip above can simply be
            replaced. The updater's own artifacts (`ACSA-Code.app.tar.gz` and its
            `.sig`) and the manifest are attached for that check; the `.sig` is
            minisign, verified against the public key compiled into the app.
