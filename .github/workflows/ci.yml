name: CI

on:
  # Named branches rather than `**`: every push used to start a full build,
  # including on throwaway branches.
  #
  # `main` is here as well as `dev` so a merge is verified before it lands, and
  # `workflow_dispatch` is here so the slow jobs can be asked for on purpose.
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck, tests, build)
    runs-on: ubuntu-latest
    env:
      # `vite build` peaks above the ~2 GB heap Node gives the runner by default
      # and dies with exit 134 (SIGABRT, "Ineffective mark-compacts near heap
      # limit"). A dev machine survives because Node sizes its default heap from
      # total RAM, so this only ever broke in CI.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      # High and critical only, on purpose. Sensible findings are reported and
      # left alone — the app ships a bundled frontend, so a devDependency advisory
      # is a build-machine concern, and `npm audit fix --force` on the two lows
      # this tree carries would downgrade Monaco across a breaking change to fix a
      # sanitiser it does not expose. A gate that can only be satisfied by
      # breaking something gets ignored, which is how it ends up unwired.
      - name: No high or critical advisories
        run: npm audit --audit-level=high

      # `npm run verify` is typecheck (both tsconfigs) plus the Python suite.
      # The engine is stdlib-only, so the tests need nothing else installed.
      - name: Verify
        run: npm run verify

      # A dependency bump that forgets to regenerate the notices would ship
      # binaries with missing attributions.
      - name: Third-party notices are current
        run: npm run notices:check

      - name: Production build
        run: npm run build

      # The Rust shell was otherwise only compiled by the `desktop` job, which is
      # skipped on pushes to `dev` — so a shell change reached CI for the first time
      # at a *tag*, and that is where a keychain dependency silently took a Tauri
      # plugin past its npm package and failed the bundle. `--locked` also asserts
      # the lockfile agrees with Cargo.toml, which is how that drift would be caught
      # here instead of at release time.
      #
      # The packages are Tauri's own Linux prerequisites plus the Secret Service
      # headers the keychain crate links against — a Linux compile of a Tauri app
      # needs the whole webview stack, which is the real cost of checking the shell
      # on every push rather than in the `desktop` job.
      - name: Rust shell compiles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          # `tauri::generate_context!()` refuses to expand while any
          # `bundle.resources` path is missing, and two of them are gitignored
          # build output: `engine/` (the ~22 MB Python freeze) and
          # `engine-codex/` (a ~212 MB download). The macro only stats the path,
          # so an empty directory satisfies it — and building them for real here
          # would put a PyInstaller freeze and a 212 MB fetch on the critical
          # path of every push, which is the `sidecar` job's work, not this one's.
          mkdir -p .tauri/engine .tauri/engine-codex
          # `--all-targets` also compiles the `#[cfg(test)]` module in main.rs,
          # which is the only place the shell's 43 tests live. Without it a
          # test-only break waited for a PR or a tag, since `cargo test` is in
          # the `desktop` job, which `dev` pushes skip.
          cargo check --manifest-path .tauri/Cargo.toml --locked --all-targets

  sidecar:
    name: Frozen engine sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # The app ships this binary so users need no Python install; if it stops
      # building, the packaged app stops working, so it is gated here.
      - name: Build acsa-engine
        run: scripts/build_engine_sidecar.sh

      - name: Every entry point imports (source mode)
        run: python3 core-engine/acsa_engine.py selftest

      - name: Sidecar answers each subcommand
        run: |
          set -euo pipefail
          BIN=".tauri/engine/acsa-engine/acsa-engine"
          export ACSA_DATA_DIR="$(mktemp -d)"
          # Fails loudly if the freeze dropped a module — `pty` was silently
          # missing once and only surfaced when a user opened the terminal.
          "$BIN" selftest
          "$BIN" db info
          "$BIN" db settings.set '{"key":"ci","value":true}'
          "$BIN" db settings.get | grep -q '"ci": true'
          "$BIN" index --project-root . --json > /dev/null
          echo "sidecar OK"

  desktop:
    name: Desktop bundle
    runs-on: macos-latest
    needs: [verify]
    # Deliberately not on every push to `dev`. It is the slowest job here (the
    # Rust app built from scratch, ~8 minutes) and it duplicated what release.yml
    # already does on a tag — so a push to the working branch paid for the same
    # build twice, and `cancel-in-progress` then threw the earlier run away
    # whenever two pushes landed close together, which is exactly when a "did the
    # bundle break?" answer is worth having. Pull requests and `main` still cover
    # it, and `gh workflow run ci.yml --ref dev` asks for it directly.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    env:
      # Inherited by `tauri build`'s beforeBuildCommand (`npm run build`).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .tauri

      - run: npm ci

      - name: Build the engine sidecar
        run: scripts/build_engine_sidecar.sh

      - name: Fetch the Codex agent runtime
        run: scripts/fetch_codex_sidecar.sh

      # `tauri::generate_context!()` is a proc macro with opinions, and each of
      # these three was a separate failed run to discover:
      #   * every `bundle.resources` path must exist — `engine/` (Python freeze)
      #     and `engine-codex/` (Codex fetch) are gitignored build output;
      #   * `frontendDist` must exist — hence the build below, which the bundle
      #     would otherwise be the first thing to create.
      # So: build everything the config references, and only then compile tests.
      - name: Build the frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path .tauri/Cargo.toml

      - name: Bundle the app
        working-directory: .tauri
        run: ../node_modules/.bin/tauri build --bundles app

      # Guards the failure that shipped for months unnoticed: a bundle that
      # builds but cannot find its engine, or panics on launch from bad plugin
      # config. Both were only caught by actually running the thing.
      - name: The bundle contains the engine and starts
        run: |
          set -euo pipefail
          APP=".tauri/target/release/bundle/macos/ACSA Code.app"
          # `acsa_engine.py` is the entry point the Rust side falls back to when
          # there is no frozen binary. This used to name `manager.py`, which the
          # harness removal deleted — so the job failed on a file that was
          # supposed to be gone.
          test -f "$APP/Contents/Resources/core-engine/acsa_engine.py"
          test -x "$APP/Contents/Resources/engine/acsa-engine/acsa-engine"
          # And the agent runtime, which is fetched at build time and shipped so a
          # user needs no Codex install. Losing it leaves an app that opens a chat
          # and cannot run an agent, which no other assertion here would catch.
          test -x "$APP/Contents/Resources/engine-codex/codex"
          # MIT needs the notice to accompany the binary, and OFL needs the font
          # licence to travel with the font. Both live inside the bundle.
          test -f "$APP/Contents/Resources/LICENSE"
          grep -q "SIL OPEN FONT LICENSE" "$APP/Contents/Resources/THIRD-PARTY-NOTICES.md"
          "$APP/Contents/MacOS/acsa-code" > /tmp/launch.log 2>&1 &
          PID=$!
          sleep 12
          kill "$PID" 2>/dev/null || true
          grep -q "Engine dir" /tmp/launch.log || (cat /tmp/launch.log; exit 1)
          echo "bundle launches and resolves its engine"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ACSA-Code-macos-app
          path: .tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14
