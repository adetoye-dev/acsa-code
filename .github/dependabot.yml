# Dependency updates on a schedule, rather than when someone remembers.
#
# Three ecosystems, which is all this repository has:
#
# - npm: the app's whole tree. Most of it is devDependencies, and those still
#   matter — they run in CI on a runner that holds the release secrets.
# - cargo: the Tauri shell in `/\.tauri` (its own manifest and lockfile).
# - github-actions: the actions this repo's own workflows pin, which is how a
#   deprecated action runtime goes unnoticed until it is force-upgraded.
#
# There is deliberately no pip entry: the engine is stdlib-only, and the frozen
# sidecar is built from it, so there is no Python dependency file to watch.
#
# `target-branch: dev` on all three. Without it Dependabot opens against the
# *default* branch, which here is `main` — and `main` only moves when a release is
# merged into it, so the pull requests sat against a branch nobody was updating,
# went red as `dev` moved on, and piled up: fourteen open at the last count, most of
# them red for reasons that had nothing to do with the bump. `dev` is where every
# change is made and verified, so it is where a dependency change belongs; the
# release merge carries it to `main` with everything else.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request a week for the routine bumps. Majors are left out of the
      # groups on purpose: a major needs reading, not merging.
      dev-minor-and-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-minor-and-patch:
        dependency-type: production
        update-types: ["minor", "patch"]

    # Ignored here are six *majors* that are not "needs reading" but blocked on work of
    # their own — each one arrives red for a reason that cannot be fixed in a pull
    # request, and a queue of permanently red pull requests is a thing to scroll past
    # rather than a reminder. The ignore *is* the note: delete the line when the upgrade
    # is done. Minors and patches for these packages keep flowing while it is in place,
    # so staying on the current major does not mean going stale on it.
    ignore:
      # Types have to describe the runtime the app actually ships on, which is Node 22 —
      # CI and the site both pin it. 26 also fails outright: TS2550, on APIs that do not
      # exist in 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React 19. react-dom 19 and its types will not resolve against react 18, so this
      # is the React upgrade rather than a bump.
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a rewrite — CSS-first config, a new engine — with this repo's token
      # file and generated-classes check to carry across it.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 does not resolve against the current lint and type tooling
      # (`npm error ERESOLVE`), and it skips a major on the way there.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint 10 is not accepted by typescript-eslint and the plugins this repo uses;
      # `@eslint/js` 10 is the same wall from the other side.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # vite 8 cannot install yet: `@vitejs/plugin-react` does not list ^8 in its
      # peer range, so `npm ci` dies with ERESOLVE at `Install dependencies` before
      # a single test runs. It is the vite upgrade plus the plugins that have to
      # move with it, not a bump.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/.tauri"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Every action in one pull request. Left ungrouped, this ecosystem's first run
      # opened five separate PRs — `checkout`, `setup-node`, `setup-python`,
      # `upload-artifact` and `action-gh-release` — for five two-line YAML edits, each
      # one carrying a full CI run. Actions have no runtime coupling to each other,
      # which is exactly what makes them safe to review as a set.
      actions:
        patterns: ["*"]
