<!doctype html>
<!--
  The social card, 1200x630, rendered to public/og.png by scripts/make-og.mjs.
  Kept as HTML rather than a checked-in drawing so it follows the page's own tokens
  and can be regenerated when the headline changes. Not part of the build.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; display: flex; align-items: center; gap: 56px;
        padding: 0 74px; background: #fbfbfd; color: #0b0b0d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .text { flex: 1; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 26px; margin-bottom: 34px; }
      h1 { font-size: 76px; line-height: 1.04; letter-spacing: -0.03em; }
      .hl {
        background: linear-gradient(92deg, #4f46e5 0%, #7c3aed 55%, #a855f7 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { margin-top: 26px; font-size: 27px; color: #6b7280; max-width: 620px; }
      .art { width: 330px; height: 330px; flex: none; }
      .card {
        width: 100%; height: 100%; border: 1px solid rgba(11, 11, 13, .1); border-radius: 26px;
        background: #fff; box-shadow: 0 30px 60px -24px rgba(11, 11, 13, .28); overflow: hidden;
      }
      .card__bar { display: flex; align-items: center; gap: 8px; padding: 13px 16px; border-bottom: 1px solid rgba(11,11,13,.06); }
      .card__bar b { font-size: 13px; color: #3f3f46; font-weight: 650; }
      .dot { width: 11px; height: 11px; border-radius: 50%; background: #d4d4d8; }
      .dot:first-child { background: #f87171; }
      .dot:nth-child(2) { background: #facc15; }
      .dot:nth-child(3) { background: #4ade80; }
      .rows { padding: 18px 18px; display: grid; gap: 11px; }
      .row { height: 11px; border-radius: 6px; background: rgba(11, 11, 13, .07); }
      .row--a { width: 78%; background: rgba(99, 102, 241, .35); }
      .row--b { width: 55%; }
      .row--c { width: 66%; }
      .row--d { width: 40%; }
      .term { margin: 6px 18px 0; background: #0b0b0d; border-radius: 12px; padding: 14px 15px; color: #d4d4d8; font-size: 13.5px; font-family: ui-monospace, Menlo, monospace; }
      .term u { color: #a5b4fc; text-decoration: underline; text-underline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand"><img src="./apex-mark.svg" alt="" width="38" height="38" />ACSA Code</div>
      <h1>Agentic coding,<br /><span class="hl">on your machine.</span></h1>
      <p>An editor, a code map and a coding agent in one desktop app.</p>
    </div>
    <div class="art">
      <div class="card">
        <div class="card__bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><b>aurora-notes</b></div>
        <div class="rows">
          <div class="row row--a"></div>
          <div class="row row--b"></div>
          <div class="row row--c"></div>
          <div class="row row--d"></div>
        </div>
        <div class="term">&#8594; Local: <u>http://localhost:5173/</u></div>
      </div>
    </div>
  </body>
</html>
