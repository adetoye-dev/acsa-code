<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — ACSA Code</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/apex-icon.svg" type="image/svg+xml" />
    <!-- Self-contained on purpose: this is served for a path that does not exist, so
         nothing here may depend on a relative URL resolving. -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #fbfbfd; color: #0b0b0d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { text-align: center; max-width: 30rem; }
      img { margin: 0 auto 22px; }
      h1 { font-size: 2rem; letter-spacing: -0.028em; }
      p { margin-top: 14px; color: #6b7280; }
      a {
        display: inline-block; margin-top: 26px; padding: 12px 22px; border-radius: 999px;
        background: #4f46e5; color: #fff; text-decoration: none; font-weight: 600;
      }
      a:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <main>
      <img src="/apex-icon.svg" alt="" width="64" height="64" />
      <h1>That page is not here</h1>
      <p>The address may have moved, or it may never have existed. The workbench is still where you left it.</p>
      <a href="/">Back to the page</a>
    </main>
  </body>
</html>
